mutation ($id: UUID!, $lastchange: DateTime!, $evaluation_date: DateTime) {
  result: resultUpdate(
    result: {id: $id, lastchange: $lastchange, evaluationDate: $evaluation_date}
  ) {
    __typename
    ...Result
    ...Error
  }
}

fragment Error on ResultGQLModelUpdateError {
	failed
}

fragment Result on ResultGQLModel {
    id
    lastchange
    evaluationDate
    result
    note
}