mutation ($id: UUID!, $lastchange: DateTime!, $name: String!) {
  result: disciplineSetUpdate(
    disciplineSet: {id: $id, lastchange: $lastchange, name: $name}
  ) {
    __typename
    ...DisciplineSet
    ...Error
  }
}

fragment Error on DisciplineSetGQLModelUpdateError {
	failed
}

fragment DisciplineSet on DisciplineSetGQLModel {
    id
    lastchange
    name
    nameEn
    description
    minimumPoints
}