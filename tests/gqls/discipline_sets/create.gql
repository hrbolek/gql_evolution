mutation ($id: UUID, $summary_id: UUID, $name: String!, $valid: Boolean) {
  result: disciplineSetInsert(
    disciplineSet: {id: $id, name: $name, summaryId: $summary_id, valid: $valid}
  ) {
    __typename
    ...Error
    ...DisciplineSet
  }
}

fragment Error on DisciplineSetGQLModelInsertError {
	__typename
}

fragment DisciplineSet on DisciplineSetGQLModel {
    id
    lastchange
    name
    name_en
    description
    minimum_points
    summary { id }
}